<html>                      <!--library book management system where each book shows title author and availability*/-->
    <head>
        <title align="center">Library management system</title>
        <style>
            .container{
                display:grid;
                grid-template-columns:auto auto auto;
                text-align:center;
                gap:20px;
            }
            .gri{
                display:grid;
                background-color:rgb(234, 147, 147);
                align:center;
                border:3px solid black;
                border-radius:10px;
                font-size:30px;
                padding:4rem;
                font-family:'Courier New', Courier, monospace;
            }
            h1{
                margin:0px 20rem 0px 20rem;
                color:#fff;
                background-color:#8b1717;
                border:solid #000; 
                border-radius:10px;
            }
        </style>
    </head>
    <body style="background-color:#ff9d13">
        <h1 font-size="55px" align="center" ><b>Library Management System</b></h1>
        <br>
        <div class="container">
            <div class="gri" style="background-color:#7893ff"><b>Until August</b><br>
                <br>Gabriel Garcia<br>
                <br>5 Stock available</div>
            <div class="gri" style="background-color:#ee5df6"><b>War and Peace</b>
                <br><br>Leo Tolstoy<br>
                <br>1 Stock available</div>
            <div class="gri" style="background-color:#b975e4"><b>Ram C/O Anandhi</b>
                <br><br>Akhil P Dharmajan<br>
                <br>No Stock available</div>
            <div class="gri" style="background-color:#32bb79"><b>Ruthinte Lokam</b>
                <br><br>Lalo Jose<br>
                <br>7 Stock available</div>
            <div class="gri"><b>Hamlet</b>
                <br><br>William Shakespeare<br>
                <br>2 Stock available</div>
        </div>
    </body>

</html>
